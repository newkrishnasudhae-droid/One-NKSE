name: Extract ZIP and Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found inside ZIP"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Android project: $PROJECT_DIR"

          cp -r "$PROJECT_DIR"/. ./ 

          echo "Final project structure:"
          find . -maxdepth 3 -type f | sort

      - name: Build Debug APK
        uses: gradle/gradle-build-action@v3
        with:
          arguments: assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HardwareStoreLedger-debug
          path: |
            **/build/outputs/apk/debug/*.apk
